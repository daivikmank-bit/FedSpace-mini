; PlatformIO Project Configuration File for FedSpace-Mini v2
; Dual-ESP32 Targets: Sat A DUT & EGSE Relay

[platformio]
default_envs = mcu2_egse_relay

[env]
platform = espressif32
board = esp32dev
framework = espidf
monitor_speed = 921600
upload_speed = 921600
build_flags = 
    -I firmware/include
    -O2

[env:mcu1_sat_a_dut]
build_src_filter = 
    +<src/cobs.c>
    +<src/crc16.c>
    +<mcu1_sat_a_dut/main.c>

[env:mcu2_egse_relay]
build_src_filter = 
    +<src/cobs.c>
    +<src/crc16.c>
    +<mcu2_egse_relay/main.c>

